<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gợi ý đăng bài social - TechVision</title>
  <meta name="description" content="Tool nội bộ: chọn 1 bài techvision.click, AI soạn bản nháp đăng X, Threads, Facebook, TikTok và YouTube.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/uploads/favicon-avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3efe8; --text: #1c1a17; --accent: #c0392b;
      --muted: rgba(28,26,23,0.82); --dim: rgba(28,26,23,0.58); --line: rgba(28,26,23,0.10);
      --card: #fdfbf7;
      --shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -16px rgba(28,26,23,0.18);
      --serif: 'Lora', Georgia, serif; --sans: 'Be Vietnam Pro', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.65; }
    a { color: var(--accent); text-decoration: none; }
    .top-bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 1rem;
      padding: 0.9rem 1.4rem; border-bottom: 1px solid var(--line); background: rgba(243,239,232,0.92);
      backdrop-filter: blur(12px); }
    .top-bar .back { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .top-bar .back:hover { color: var(--accent); }
    .top-bar h1 { font-family: var(--serif); font-size: 1.05rem; margin-left: auto; white-space: nowrap; }
    .top-bar h1 em { color: var(--accent); font-style: normal; }
    main { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.4rem 4rem; display: grid; grid-template-columns: 330px 1fr; gap: 1.4rem; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

    .picker { border: 1px solid var(--line); background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; align-self: start; }
    .picker .ph { padding: 0.9rem 1rem 0.6rem; border-bottom: 1px solid var(--line); }
    .picker .ph b { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .picker input { width: 100%; margin-top: 0.55rem; padding: 0.55rem 0.8rem; font: inherit; font-size: 0.85rem;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg); outline: none; }
    .picker input:focus { border-color: var(--accent); }
    .plist { max-height: 62vh; overflow-y: auto; }
    .pitem { display: block; width: 100%; text-align: left; padding: 0.65rem 1rem; border: 0; border-bottom: 1px solid var(--line);
      background: none; font: inherit; font-size: 0.83rem; color: var(--muted); cursor: pointer; }
    .pitem:hover { background: rgba(192,57,43,0.05); }
    .pitem.on { background: rgba(192,57,43,0.09); border-left: 3px solid var(--accent); }
    .pitem .pd { display: block; font-size: 0.68rem; color: var(--dim); margin-top: 0.15rem; }

    .out { min-width: 0; }
    .sel { display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; margin-bottom: 1.1rem; }
    .sel .st { font-family: var(--serif); font-size: 1.12rem; font-weight: 600; flex: 1 1 300px; min-width: 0; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 0.78rem; font-weight: 600;
      color: var(--text); cursor: pointer; white-space: nowrap; transition: all .15s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.pri:hover { filter: brightness(1.08); color: #fff; }
    .status { font-size: 0.82rem; color: var(--dim); margin: 1rem 0; }
    .status.err { color: var(--accent); }
    .spin { display: inline-block; width: 0.85em; height: 0.85em; border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 0.4rem; }
    @keyframes sp { to { transform: rotate(360deg); } }

    .cards { display: grid; gap: 1rem; }
    .kcard { border: 1px solid var(--line); background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .kh { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.1rem; border-bottom: 1px solid var(--line); }
    .kh .ic { font-size: 1.05rem; }
    .kh b { font-size: 0.85rem; letter-spacing: 0.04em; }
    .kh .open { margin-left: auto; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .kb { padding: 0.9rem 1.1rem 1.1rem; display: grid; gap: 0.8rem; }
    .blk { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem 0.75rem; }
    .blk .bl { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 0.3rem; }
    .blk pre { font: inherit; font-size: 0.87rem; white-space: pre-wrap; word-break: break-word; color: var(--text); }
    .cp { position: absolute; top: 0.55rem; right: 0.6rem; padding: 0.25rem 0.7rem; font-size: 0.68rem; font-weight: 600;
      border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-family: inherit; transition: all .15s; }
    .cp:hover { border-color: var(--accent); color: var(--accent); }
    .cp.ok { background: #2e7d32; border-color: #2e7d32; color: #fff; }
    footer { text-align: center; padding: 2rem 1rem 3rem; font-size: 0.72rem; color: var(--dim); }
  </style>
</head>
<body>
  <nav class="top-bar">
    <a href="/" class="back">← techvision.click</a>
    <a href="/blog.html" class="back">Tech News</a>
    <h1>🚀 Gợi ý <em>đăng bài social</em></h1>
  </nav>

  <main>
    <aside class="picker">
      <div class="ph">
        <b>Chọn bài viết (mới nhất trước)</b>
        <input type="search" id="q" placeholder="Tìm theo tiêu đề..." autocomplete="off">
      </div>
      <div class="plist" id="plist"></div>
    </aside>

    <section class="out">
      <div class="sel">
        <div class="st" id="selTitle">Đang tải danh sách bài...</div>
        <button class="btn pri" id="genBtn">✨ Tạo gợi ý</button>
        <a class="btn" id="viewBtn" target="_blank" rel="noopener" href="#">Xem bài</a>
      </div>
      <div class="status" id="status"></div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <footer>Tool nội bộ TechVision · AI (Groq) soạn nháp, anh Long duyệt và chỉnh trước khi đăng · Không index</footer>

  <script>
  (function () {
    var SITE = 'https://techvision.click';
    var arts = [], cur = null, busy = false;
    var $ = function (id) { return document.getElementById(id); };

    fetch('/chat-index.json').then(function (r) { return r.json(); }).then(function (d) {
      arts = d;
      renderList('');
      if (arts[0]) select(0, true);
    }).catch(function () { $('status').textContent = 'Không tải được danh sách bài.'; });

    function slugOf(a) { return (a.u.match(/\/articles\/([\w-]+)\.html/) || [])[1] || ''; }

    function renderList(q) {
      var qq = q.toLowerCase();
      var html = '';
      var n = 0;
      for (var i = 0; i < arts.length && n < 40; i++) {
        var a = arts[i];
        if (qq && a.t.toLowerCase().indexOf(qq) < 0) continue;
        n++;
        html += '<button class="pitem" data-i="' + i + '"><span>' + esc(a.t) + '</span><span class="pd">' + esc(a.c) + ' · ' + esc(a.dt) + '</span></button>';
      }
      $('plist').innerHTML = html || '<div style="padding:1rem;font-size:0.8rem;color:var(--dim)">Không thấy bài nào.</div>';
    }

    $('q').addEventListener('input', function () { renderList(this.value); });
    $('plist').addEventListener('click', function (e) {
      var b = e.target.closest('.pitem');
      if (b) select(+b.dataset.i, false);
    });
    $('genBtn').addEventListener('click', function () { if (cur) gen(); });

    function select(i, auto) {
      cur = arts[i];
      var items = document.querySelectorAll('.pitem');
      for (var k = 0; k < items.length; k++) items[k].classList.toggle('on', +items[k].dataset.i === i);
      $('selTitle').textContent = cur.t;
      $('viewBtn').href = SITE + cur.u;
      $('cards').innerHTML = '';
      $('status').textContent = '';
      if (auto) gen();
    }

    function gen() {
      if (busy || !cur) return;
      busy = true;
      $('cards').innerHTML = '';
      $('status').innerHTML = '<span class="spin"></span>AI đang đọc bài và soạn nháp cho 5 nền tảng (5-10 giây)...';
      $('status').className = 'status';
      fetch('/api/social-kit?slug=' + encodeURIComponent(slugOf(cur)))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          busy = false;
          if (!res.ok || !res.j.kit) {
            $('status').textContent = (res.j && res.j.error) || 'Có lỗi, thử lại nhé.';
            $('status').className = 'status err';
            return;
          }
          $('status').textContent = '';
          render(res.j.kit, SITE + cur.u);
        })
        .catch(function () {
          busy = false;
          $('status').textContent = 'Mất kết nối, thử lại nhé.';
          $('status').className = 'status err';
        });
    }

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function tags(arr, pre) { return (arr || []).map(function (h) { return pre + String(h).replace(/^#/, ''); }).join(' '); }
    function blk(label, text) {
      return '<div class="blk"><div class="bl">' + esc(label) + '</div><pre>' + esc(text) + '</pre><button class="cp" data-t="' + esc(text) + '">Copy</button></div>';
    }

    function render(kit, url) {
      var h = '';
      if (kit.x) {
        var xText = (kit.x.post || '') + (kit.x.hashtags && kit.x.hashtags.length ? '\n' + tags(kit.x.hashtags, '#') : '');
        h += '<div class="kcard"><div class="kh"><span class="ic">𝕏</span><b>X (Twitter)</b>' +
          '<a class="open" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(xText) + '">Mở X để đăng ↗</a></div><div class="kb">' +
          blk('Post đơn', xText) +
          (kit.x_thread && kit.x_thread.length ? blk('Thread ' + kit.x_thread.length + ' tweet', kit.x_thread.map(function (t, i) { return (i + 1) + '/ ' + t; }).join('\n\n')) : '') +
          '</div></div>';
      }
      if (kit.threads) {
        h += '<div class="kcard"><div class="kh"><span class="ic">@</span><b>Threads</b>' +
          '<a class="open" target="_blank" rel="noopener" href="https://www.threads.net/intent/post?text=' + encodeURIComponent(kit.threads) + '">Mở Threads ↗</a></div><div class="kb">' +
          blk('Post', kit.threads) + '</div></div>';
      }
      if (kit.facebook) {
        h += '<div class="kcard"><div class="kh"><span class="ic">📘</span><b>Facebook</b>' +
          '<a class="open" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '">Mở FB share ↗</a></div><div class="kb">' +
          blk('Post (dán vào phần lời nhắn)', kit.facebook) + '</div></div>';
      }
      if (kit.tiktok) {
        h += '<div class="kcard"><div class="kh"><span class="ic">🎵</span><b>TikTok</b></div><div class="kb">' +
          blk('Hook 3 giây đầu', kit.tiktok.hook || '') +
          blk('Kịch bản 30-45s', kit.tiktok.script || '') +
          blk('Caption', (kit.tiktok.caption || '') + (kit.tiktok.hashtags && kit.tiktok.hashtags.length ? '\n' + tags(kit.tiktok.hashtags, '#') : '')) +
          '</div></div>';
      }
      if (kit.youtube) {
        h += '<div class="kcard"><div class="kh"><span class="ic">▶️</span><b>YouTube</b></div><div class="kb">' +
          blk('Tiêu đề video', kit.youtube.title || '') +
          blk('Mô tả', kit.youtube.description || '') +
          blk('Tags', (kit.youtube.tags || []).join(', ')) +
          blk('Kịch bản Shorts 45-60s', kit.youtube.shorts_script || '') +
          '</div></div>';
      }
      $('cards').innerHTML = h;
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('.cp');
      if (!b) return;
      navigator.clipboard.writeText(b.dataset.t).then(function () {
        b.textContent = 'Đã copy ✓'; b.classList.add('ok');
        setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1600);
      });
    });
  })();
  </script>
</body>
</html>
