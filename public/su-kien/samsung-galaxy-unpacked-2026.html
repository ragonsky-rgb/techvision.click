    function render(){

    var io;
    function observeReveals(){
      if(!('IntersectionObserver' in window)){ document.querySelectorAll('[data-reveal]').forEach(function(e){e.classList.add('revealed');}); return; }
      if(!io){ io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); } }); }, {threshold:.12, rootMargin:'0px 0px -8% 0px'}); }
      if(firstPaintDone){ document.querySelectorAll('[data-reveal]:not(.revealed)').forEach(function(e){e.classList.add('revealed');}); return; }
      requestAnimationFrame(function(){ document.querySelectorAll('[data-reveal]').forEach(function(e){ io.observe(e); }); });
    }

    // countdown to 22 Jul 2026 10:00 London (BST = UTC+1)
    var target = new Date('2026-07-22T10:00:00+01:00').getTime();
    function tick(){
      var diff = target - Date.now();
      var d,h,m,s;
      if(diff<=0){ d=h=m=s=0; } else {
        d=Math.floor(diff/86400000); diff-=d*86400000;
        h=Math.floor(diff/3600000); diff-=h*3600000;
        m=Math.floor(diff/60000); diff-=m*60000;
        s=Math.floor(diff/1000);
      }
      document.getElementById('cd-d').textContent=pad(d);
      document.getElementById('cd-h').textContent=pad(h);
      document.getElementById('cd-m').textContent=pad(m);
      document.getElementById('cd-s').textContent=pad(s);
    }

    langEl.addEventListener('click', toggle);
    langEl.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
