<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho hồ sơ gốc · Portfolio | LongTechVision</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f2ed">
  <link rel="icon" type="image/jpeg" href="/uploads/favicon-avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f2ed; --card:#fff; --ink:#1f1d1a; --mute:#6b655c; --line:#e4ded4; --accent:#C0392B; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif; }
    main { max-width:760px; margin:0 auto; padding:40px 16px 64px; }
    a { color:var(--accent); }
    h1 { font:700 28px/1.25 Lora,serif; margin:8px 0 6px; }
    .sub { color:var(--mute); margin:0 0 24px; }
    .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
    form { display:flex; gap:10px; flex-wrap:wrap; }
    input { flex:1 1 220px; min-height:46px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; }
    button { min-height:46px; padding:10px 18px; border:0; border-radius:10px; background:var(--ink); color:#fff; font:600 15px "Be Vietnam Pro",sans-serif; cursor:pointer; }
    button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); min-height:38px; padding:6px 12px; font-size:14px; }
    #msg { margin:12px 0 0; color:var(--mute); font-size:14px; min-height:1.4em; }
    #msg.err { color:var(--accent); }
    .group { margin-top:28px; }
    .group h2 { font:600 18px/1.35 Lora,serif; margin:0 0 10px; }
    .row { display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
    .row .name { flex:1; min-width:0; overflow-wrap:anywhere; }
    .row .meta { color:var(--mute); font-size:13px; }
    .acts { display:flex; gap:6px; flex-shrink:0; }
    .back { font-size:14px; }
    @media (max-width:520px) { .row { flex-wrap:wrap; } .acts { width:100%; } }
  </style>
</head>
<body>
<main>
  <a class="back" href="/portfolio/#activation">← Portfolio</a>
  <h1>Kho hồ sơ gốc</h1>
  <p class="sub">Hợp đồng, biên bản nghiệm thu, đề xuất và báo giá của các dự án Brand Activation. Nội dung đã được mã hoá, cần mã khoá để mở. <br><em>Original project documents, encrypted. Access code required.</em></p>

  <div class="box">
    <form id="f" autocomplete="off">
      <label for="pw" style="position:absolute;left:-9999px">Mã khoá</label>
      <input id="pw" type="password" placeholder="Nhập mã khoá / Access code" required>
      <button type="submit">Mở kho</button>
    </form>
    <p id="msg" role="status"></p>
  </div>

  <div id="list"></div>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const mb = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
  const say = (t, err) => { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; };
  let key, files;

  const open = async (f, download) => {
    say('Đang giải mã ' + f.name + '...');
    const res = await fetch('f/' + f.id + '.bin');
    if (!res.ok) return say('Không tải được file (' + res.status + ')', true);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(f.iv) }, key, await res.arrayBuffer());
    const url = URL.createObjectURL(new Blob([plain], { type: f.mime }));
    const a = document.createElement('a');
    a.href = url;
    if (download) a.download = f.name.split('/').pop(); else a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    say('');
  };

  const render = () => {
    const groups = {};
    files.forEach((f) => (groups[f.group] ||= []).push(f));
    const list = $('#list');
    list.innerHTML = '';
    Object.keys(groups).sort().forEach((g) => {
      const sec = document.createElement('section');
      sec.className = 'group';
      const h = document.createElement('h2');
      h.textContent = g.replace(/^\d+-/, '').replace(/-/g, ' ');
      sec.appendChild(h);
      groups[g].forEach((f) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<div class="name"></div><div class="acts"></div>';
        row.querySelector('.name').innerHTML = '<div></div><div class="meta"></div>';
        row.querySelector('.name > div').textContent = f.name;
        row.querySelector('.meta').textContent = mb(f.size);
        const acts = row.querySelector('.acts');
        if (/^(application\/pdf|image\/)/.test(f.mime)) {
          const v = document.createElement('button'); v.className = 'ghost'; v.textContent = 'Xem';
          v.onclick = () => open(f, false).catch(() => say('Lỗi giải mã', true)); acts.appendChild(v);
        }
        const d = document.createElement('button'); d.className = 'ghost'; d.textContent = 'Tải về';
        d.onclick = () => open(f, true).catch(() => say('Lỗi giải mã', true)); acts.appendChild(d);
        sec.appendChild(row);
      });
      list.appendChild(sec);
    });
  };

  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    say('Đang kiểm tra mã khoá...');
    try {
      const v = await (await fetch('vault.json', { cache: 'no-store' })).json();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('#pw').value), 'PBKDF2', false, ['deriveKey']);
      key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(v.salt), iterations: v.iter },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(v.manifest.iv) }, key, b64(v.manifest.data));
      files = JSON.parse(new TextDecoder().decode(plain)).files;
      $('#pw').value = '';
      say(files.length + ' tài liệu.');
      render();
    } catch (err) {
      say('Mã khoá không đúng.', true);
    }
  });
})();
</script>
</body>
</html>
